[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "divergencequant"
version = "0.1.0"
description = "DivergenceQuant 加密货币量化交易系统"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "aiosqlite>=0.20,<1",
    "asyncpg>=0.29,<1",
    "cryptography>=42,<49",
    "fastapi>=0.111,<1",
    "greenlet>=3,<4",
    "loguru>=0.7,<1",
    "numpy>=1.26,<3",
    "pydantic>=2.7,<3",
    "PyJWT>=2.8,<3",
    "PyYAML>=6.0,<7",
    "redis>=5.0,<7",
    "SQLAlchemy[asyncio]>=2.0,<3",
    "tzdata>=2024.1",
    "uvicorn>=0.30,<1",
    "websockets>=12,<16",
]

[project.optional-dependencies]
desktop = [
    "PySide6>=6.8,<6.9",
    "pyinstaller>=6.11,<6.12",
]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<2",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests", "."]
python_files = ["test_*.py", "*_test.py"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
pretty = true
