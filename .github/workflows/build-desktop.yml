name: Build Desktop Application (Windows Release)

on:
  push:
    branches:
      - main
      - desktop-release
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Standalone Executable (.exe)
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install PySide6 uvicorn fastapi pydantic pyinstaller cryptography pyyaml Pillow

      - name: Build Standalone Executable & Package
        run: |
          python build_desktop_exe.py

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DivergenceQuant-Windows-x64
          path: dist/DivergenceQuant-Windows-x64.zip
          retention-days: 14

      - name: Publish Release Package (on Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DivergenceQuant-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
